<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadastro de registros</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#0d111d;color:#fff;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px 16px 60px}h1{font-size:24px}h2{font-size:19px;margin-top:0}section{background:#171b26;border:1px solid #303847;border-radius:10px;padding:18px;margin:16px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}label{display:grid;gap:6px;font-size:14px;color:#d5d9e2}input,select,button{font:inherit;border-radius:7px;padding:10px;border:1px solid #697181}input,select{width:100%;background:#0d111d;color:#fff}button{cursor:pointer;background:#00537d;color:#fff;border:0;margin-top:14px}button.secondary{background:#343c4c;margin:5px 0}button:disabled{opacity:.5;cursor:not-allowed}.row{border-top:1px solid #303847;padding:10px 0}.hint{color:#b3bac9;font-size:14px;line-height:1.5}[hidden]{display:none!important}#message{min-height:1.5em;color:#bcddec}
</style></head>
<body><main><h1>Cadastro de registros</h1><p class="hint">Informe o identificador do aluno e sua chave administrativa para consultar e cadastrar dados.</p>
<section><form id="lookup"><div class="fields"><label>Chave administrativa<input name="token" type="password" required autocomplete="off"></label><label>Identificador do aluno<input name="cardId" required autocomplete="off"></label></div><button>Consultar aluno</button></form><p id="message" role="status" aria-live="polite"></p></section>
<div id="records" hidden><h2 id="student"></h2><p class="hint">Cadastre somente dados confirmados. Para alterar um registro, selecione Editar.</p>
<section><h2>Disciplinas, notas e faltas</h2><div id="disciplines"></div><form id="discipline"><input type="hidden" name="id"><div class="fields"><label>Nome da disciplina<input name="name" required maxlength="200"></label><label>Código<input name="code" maxlength="100"></label><label>Nota<input name="grade" type="number" min="0" step="0.01"></label><label>Nota máxima<input name="gradeMax" type="number" min="0.01" step="0.01"></label><label>Faltas<input name="absences" type="number" min="0" step="1"></label><label>Limite de faltas<input name="absenceLimit" type="number" min="1" step="1"></label></div><button>Salvar disciplina</button> <button class="secondary" type="reset">Novo registro</button></form></section>
<section><h2>Boletos</h2><div id="bills"></div><form id="bill"><input type="hidden" name="id"><div class="fields"><label>Descrição<input name="description" required maxlength="200"></label><label>Vencimento<input name="dueDate" type="date" required></label><label>Valor em reais<input name="amount" type="number" min="0" step="0.01" required></label><label>Situação<select name="status"><option>PENDENTE</option><option>PAGO</option><option>CANCELADO</option></select></label><label>Link HTTPS do boleto (opcional)<input name="paymentUrl" type="url" placeholder="https://"></label></div><button>Salvar boleto</button> <button class="secondary" type="reset">Novo registro</button></form></section></div></main><script src="/admin-registros.js" defer></script></body></html>
